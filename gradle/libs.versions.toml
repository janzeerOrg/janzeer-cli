[versions]
kotlin = "2.2.0"
clikt = "5.0.3"
mordant = "3.0.2"
janzeerSdk = "0.1.3"
serialization = "1.9.0"
okhttp = "4.12.0"
graalvmNative = "0.10.6"
junit = "5.11.4"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }
janzeer-sdk-core = { module = "org.janzeer:janzeer-sdk-core", version.ref = "janzeerSdk" }
janzeer-sdk-client = { module = "org.janzeer:janzeer-sdk-client", version.ref = "janzeerSdk" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }
